<html lang="ko">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
  :root{
    /* 500·600·700: 초록색 계열 */
    --c500:#15803D; /* 짙은 숲 초록 */
    --c600:#16A34A; /* 싱그러운 초록 */
    --c700:#84CC16; /* 상큼한 연두 라임 */

    /* 800·900·1000: 노란색 계열 (1000살이 가장 화사한 샛노란 골드) */
    --c800:#FDE047; /* 은은하고 맑은 레몬 노랑 */
    --c900:#FACC15; /* 따뜻하고 풍성한 개나리 노랑 */
    --c1000:#EAB308; /* 가장 예쁜 대표 샛노란 은행잎 골드 */
    --ring:#FEF08A; /* 1000살 이상 반짝이는 샛노란 테두리 */

    --ink:#1f2419; --sub:#6b715f; --line:#e6e8dd; --bg:#f7f6f0; --card:#ffffff; --accent:#16a34a;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    font-family:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,system-ui,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
    background:var(--bg); color:var(--ink); display:flex; flex-direction:column; height:100dvh; overflow:hidden;
    position:relative;
  }
  /* ── 은행잎 낙하 애니메이션 캔버스 (클릭 통과, 화면 전체 오버레이) ── */
  #leafCanvas{
    position:fixed; top:0; left:0; width:100%; height:100%;
    pointer-events:none; z-index:2500;
  }
  /* ── 상단 컨트롤 패널 ── */
  #panel{
    background:var(--card); border-bottom:1px solid var(--line);
    padding:12px 16px 11px; z-index:1000; flex:0 0 auto;
    box-shadow:0 2px 14px rgba(60,60,30,.07);
  }
  #panel h1{font-size:1.22rem; letter-spacing:-.02em; display:flex; align-items:center; gap:8px;}
  #panel h1 .em{font-size:1.32rem;}
  #subtitle{margin-top:2px; font-size:.8rem; color:var(--sub); letter-spacing:-.01em;}
  #controls{margin-top:9px; display:flex; gap:9px; flex-wrap:wrap; align-items:center;}
  #filters{display:flex; gap:6px; flex-wrap:wrap; align-items:center;}
  .fbtn{
    border:1.5px solid var(--line); background:#fff; color:var(--ink);
    padding:5px 12px; border-radius:999px; font-size:.82rem; font-weight:700; cursor:pointer;
    transition:all .15s ease; font-family:inherit; user-select:none;
    display:inline-flex; align-items:center; gap:4px;
  }
  .fbtn:hover{border-color:#c9cdb8;}
  .fbtn.active{
    border-color:transparent !important;
    box-shadow:0 3px 8px rgba(60,60,30,.18);
  }
  .fbtn .fdot{
    display:inline-block; width:7.5px; height:7.5px; border-radius:50%;
  }
  #searchwrap{flex:1; min-width:180px; max-width:340px; position:relative;}
  #search{
    width:100%; padding:7px 12px 7px 34px; border:1.5px solid var(--line); border-radius:10px;
    font-size:.86rem; font-family:inherit; background:#fff; outline:none; transition:border-color .15s;
  }
  #search:focus{border-color:var(--accent);}
  #searchwrap .ico{position:absolute; left:11px; top:50%; transform:translateY(-50%); font-size:.88rem; opacity:.55;}
  #noresult{display:none; margin-top:8px; font-size:.82rem; color:#b3403a;}
  /* ── 지도 ── */
  #map{flex:1 1 auto; min-height:0; z-index:1;}
  .leaflet-container{font-family:inherit;}
  /* ── 부채꼴 은행잎 마커 ── */
  .ginkgo-leaf-marker{
    background:none !important; border:none !important;
    cursor:pointer;
    transition:transform .2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }
  .ginkgo-leaf-marker:hover{
    transform:scale(1.28) translateY(-4px);
    z-index:9999 !important;
  }
  .ginkgo-leaf-svg{
    display:block;
    filter:drop-shadow(0 3px 6px rgba(25,35,15,.36));
  }
  /* ── 팝업 카드 ── */
  .ginkgo-popup .leaflet-popup-content-wrapper{
    border-radius:16px; box-shadow:0 10px 34px rgba(40,40,20,.22); padding:0; overflow:hidden;
  }
  .ginkgo-popup .leaflet-popup-content{margin:0; width:290px !important; max-width:86vw;}
  .ginkgo-popup .leaflet-popup-tip{box-shadow:none;}
  .gp-head{padding:12px 14px 10px; color:#fff; position:relative;}
  .gp-head .badge{
    display:inline-block; background:rgba(255,255,255,.24); border:1px solid rgba(255,255,255,.45);
    border-radius:999px; padding:2px 10px; font-size:.72rem; font-weight:800; letter-spacing:.01em;
  }
  .gp-head .age{position:absolute; right:14px; top:11px; font-size:.78rem; font-weight:700; opacity:.95;}
  .gp-title{padding:12px 14px 4px;}
  .gp-title .nm{font-size:1.02rem; font-weight:800; letter-spacing:-.02em; line-height:1.3;}
  .gp-title .dz{
    display:inline-block; margin-top:6px; font-size:.73rem; font-weight:700; color:#2e6f40;
    background:#e8f4ec; border-radius:999px; padding:3px 10px;
  }
  .gp-specs{display:flex; gap:8px; margin:10px 14px 0;}
  .gp-specs .sp{
    flex:1; background:#f5f6ef; border-radius:10px; padding:7px 10px; font-size:.72rem; color:var(--sub);
  }
  .gp-specs .sp b{display:block; font-size:.86rem; color:var(--ink); margin-top:2px;}
  .gp-addr{margin:10px 14px 0; font-size:.78rem; color:#4c5245; line-height:1.45;}
  .gp-addr::before{content:"📍 "; }
  .gp-lore{
    margin:10px 14px 0; font-size:.79rem; line-height:1.55; color:#3c4232;
    background:#faf9f2; border-left:3px solid #d9dcbd; padding:8px 10px; border-radius:0 8px 8px 0;
  }
  .gp-links{display:flex; gap:8px; margin:12px 14px 14px;}
  .gp-links a{
    flex:1; text-align:center; text-decoration:none; font-size:.78rem; font-weight:700;
    padding:8px 4px; border-radius:9px; transition:filter .15s;
  }
  .gp-links a.kakao{background:#FEE500; color:#191600;}
  .gp-links a.naver{background:#03C75A; color:#fff;}
  .gp-links a:hover{filter:brightness(.94);}
  .gp-count{
    position:absolute; right:12px; bottom:10px; font-size:.7rem; font-weight:800;
    background:rgba(255,255,255,.25); border-radius:999px; padding:2px 8px; color:#fff;
  }
  /* ── 출처 안내 ── */
  #credit{
    position:absolute; left:10px; bottom:12px; z-index:800; background:rgba(255,255,255,.92);
    border-radius:8px; padding:5px 9px; font-size:.64rem; color:#84867a; line-height:1.5; max-width:74vw;
    box-shadow:0 2px 8px rgba(40,40,20,.12);
  }
  @media (max-width:600px){
    #panel{padding:10px 12px 9px;}
    #panel h1{font-size:1.02rem;}
    #subtitle{font-size:.74rem;}
    .fbtn{padding:4px 9px; font-size:.76rem;}
    #search{padding:6px 10px 6px 30px; font-size:.82rem;}
    .ginkgo-popup .leaflet-popup-content{width:270px !important;}
  }
</style>
</head>

  <h1><span class="em">🍂</span> 대한민국 천년 은행나무 지도</h1>

  <div id="controls">

    <div id="searchwrap">

    </div>
  </div>
  <div id="noresult">선택된 조건에 맞는 은행나무가 없습니다.</div>
</div>

<div id="map">
  <div id="credit">📌 좌표·제원은 국가유산포털, 각 지자체 고시 자료와 카카오 지오코딩 기준이며 일부 위치는 근사치입니다.<br>수령은 전통적 통용 추정치로, 최근 과학적 측정과 다를 수 있습니다.</div>
</div>

/* ── 기본 지도 ── */
const map = L.map('map', {zoomControl:false, worldCopyJump:true});
L.control.zoom({position:'bottomright'}).addTo(map);
const osm = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom:19, attribution:'© OpenStreetMap 기여자'
}).addTo(map);
const positron = L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
  maxZoom:20, subdomains:'abcd', attribution:'© CARTO © OpenStreetMap 기여자'
});
L.control.layers({'오픈스트리트맵(한글)':osm, '심플 회색 지도':positron}, null, {position:'bottomright', collapsed:true}).addTo(map);

/* ── 부채꼴 은행잎 SVG 마커 생성 ── */
function makeGinkgoSvg(color, isMillennium, sz){
  const strokeColor = isMillennium ? '#FEF08A' : '#ffffff';
  const strokeW = isMillennium ? '2.8' : '1.6';
  const halo = isMillennium ? '<circle cx="20" cy="18" r="16.5" fill="none" stroke="#FDE047" stroke-width="2.4" stroke-dasharray="2.5 2.5" opacity="0.95"/>' : '';

  return `
    <svg class="ginkgo-leaf-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="${sz}" height="${sz}">
      ${halo}
      <path d="M 20 38 C 19.5 33 19.5 28 20 25 C 16 23.5 10 20 5 15.5 C 3.5 12.5 5 7.5 10.5 5 C 14.5 3.2 18 5 20 8.5 C 22 5 25.5 3.2 29.5 5 C 35 7.5 36.5 12.5 35 15.5 C 30 20 24 23.5 20 25 C 20.5 28 20.5 33 20 38 Z"
            fill="${color}" stroke="${strokeColor}" stroke-width="${strokeW}" stroke-linejoin="round"/>
      <path d="M 20 25 C 17 21 11 16 7 12" stroke="rgba(255,255,255,0.52)" stroke-width="0.9" fill="none" stroke-linecap="round"/>
      <path d="M 20 25 C 18 19 14 13 11 7.5" stroke="rgba(255,255,255,0.52)" stroke-width="0.9" fill="none" stroke-linecap="round"/>
      <path d="M 20 25 L 20 10.5" stroke="rgba(255,255,255,0.56)" stroke-width="1.0" fill="none" stroke-linecap="round"/>
      <path d="M 20 25 C 22 19 26 13 29 7.5" stroke="rgba(255,255,255,0.52)" stroke-width="0.9" fill="none" stroke-linecap="round"/>
      <path d="M 20 25 C 23 21 29 16 33 12" stroke="rgba(255,255,255,0.52)" stroke-width="0.9" fill="none" stroke-linecap="round"/>
    </svg>`;
}

/* ── 마커 생성 ── */
const markers = [];
TREES.forEach((t) => {
  const col = COLORS[t.tag];
  const isMill = t.tag === "1000살 이상";
  const sz = SIZES[t.tag] || 28;
  const icon = L.divIcon({
    className: 'ginkgo-leaf-marker',
    html: makeGinkgoSvg(col, isMill, sz),
    iconSize: [sz, sz],
    iconAnchor: [sz / 2, sz * 0.94],
    popupAnchor: [0, -sz * 0.88]
  });
  const m = L.marker([t.lat, t.lng], {icon: icon});
  m._tree = t;
  m.bindPopup(popupHtml(t), {className:'ginkgo-popup', maxWidth:320, minWidth:230});
  markers.push(m);
});

function popupHtml(t){
  const col = COLORS[t.tag];
  const cnt = t.count > 1 ? `<span class="gp-count">${t.count}그루</span>` : '';
  const q = encodeURIComponent(t.name);
  const headTextCol = (t.tag === '800살' || t.tag === '900살') ? '#1c1917' : '#ffffff';
  return `
  <div class="gp-head" style="background:linear-gradient(120deg, ${col}, #ca8a04 150%); color:${headTextCol};">
    <span class="badge" style="border-color:currentColor; color:currentColor;">${t.tag}</span>
    <span class="age">${t.ageLabel}</span>
    ${cnt}
  </div>
  <div class="gp-title">
    <div class="nm">${t.name}</div>
    <span class="dz">${t.desig}</span>
  </div>
  <div class="gp-specs">
    <div class="sp">수고(높이)<b>${t.h}</b></div>
    <div class="sp">흉고둘레<b>${t.c}</b></div>
  </div>
  <div class="gp-addr">${t.addr}</div>
  <div class="gp-lore">${t.lore}</div>
  <div class="gp-links">
    <a class="kakao" href="https://map.kakao.com/link/to/${q},${t.lat},${t.lng}" target="_blank" rel="noopener">카카오맵 길찾기</a>
    <a class="naver" href="https://map.naver.com/p/search/${q}" target="_blank" rel="noopener">네이버지도 검색</a>
  </div>`;
}

/* ── 태그별 카운트 ── */
const tagCounts = {};
ALL_TAGS.forEach(tag => tagCounts[tag] = TREES.filter(t=>t.tag===tag).length);

/* ── 멀티 토글 필터 (디폴트: 600살 이상 전체 활성화) ── */
const activeTags = new Set(["600살", "700살", "800살", "900살", "1000살 이상"]);
const filtersEl = document.getElementById('filters');

function updateFilterStyles(){
  [...filtersEl.children].forEach(btn => {
    const tag = btn.dataset.tag;
    const isActive = activeTags.has(tag);
    btn.classList.toggle('active', isActive);
    const dot = btn.querySelector('.fdot');
    if(isActive){
      btn.style.background = COLORS[tag];
      btn.style.color = BTN_TEXT_COLORS[tag] || '#fff';
      if(dot) dot.style.background = BTN_TEXT_COLORS[tag] || '#fff';
    } else {
      btn.style.background = '#fff';
      btn.style.color = (tag.startsWith('800') || tag.startsWith('900')) ? '#a16207' : COLORS[tag];
      if(dot) dot.style.background = COLORS[tag];
    }
  });
}

ALL_TAGS.forEach(tag => {
  const btn = document.createElement('button');
  btn.className = 'fbtn';
  btn.dataset.tag = tag;
  const dotColor = COLORS[tag];
  btn.innerHTML = `<span class="fdot" style="background:${dotColor}"></span>${tag} <span style="opacity:.85; font-size:.76rem;">(${tagCounts[tag]})</span>`;

  btn.addEventListener('click', () => {
    if(activeTags.has(tag)){
      activeTags.delete(tag);
    } else {
      activeTags.add(tag);
    }
    updateFilterStyles();
    apply();
  });
  filtersEl.appendChild(btn);
});

updateFilterStyles();

/* ── 검색 & 필터링 적용 ── */
const searchEl = document.getElementById('search');
const noresult = document.getElementById('noresult');
searchEl.addEventListener('input', apply);
searchEl.addEventListener('keydown', e => {
  if(e.key === 'Enter'){
    const vis = markers.filter(m => m._visible);
    if(vis.length === 1){ map.flyTo([vis[0]._tree.lat, vis[0]._tree.lng], 14); vis[0].openPopup(); }
    else if(vis.length > 1){ map.fitBounds(L.featureGroup(vis).getBounds().pad(0.1)); }
  }
});

function norm(s){ return (s||'').toLowerCase().replace(/\s+/g,''); }

function apply(){
  const q = norm(searchEl.value);
  let visible = 0;
  const visibleMarkers = [];

  markers.forEach(m => {
    const t = m._tree;
    const hay = norm(t.name + ' ' + t.addr + ' ' + t.desig + ' ' + t.ageLabel);
    const okQ = !q || hay.includes(q);
    const okTag = activeTags.has(t.tag);
    const ok = okQ && okTag;

    m._visible = ok;
    if(ok){
      if(!map.hasLayer(m)) m.addTo(map);
      visibleMarkers.push(m);
      visible++;
    } else {
      if(map.hasLayer(m)) map.removeLayer(m);
    }
  });

  noresult.style.display = visible ? 'none' : 'block';
  return visibleMarkers;
}

const initialVis = apply();
if(initialVis.length > 0){
  map.fitBounds(L.featureGroup(initialVis).getBounds().pad(0.06));
}

/* ── 🍂 샛노란 은행잎 와르르 낙하 오프닝 이펙트 ── */
(function initFallingGinkgoLeaves(){
  const canvas = document.getElementById('leafCanvas');
  const ctx = canvas.getContext('2d');
  let W = canvas.width = window.innerWidth;
  let H = canvas.height = window.innerHeight;

  window.addEventListener('resize', () => {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
  });

  // 정통 부채꼴 은행잎 Path2D (좌표계 40x40 기준)
  const leafPath = new Path2D("M 20 38 C 19.5 33 19.5 28 20 25 C 16 23.5 10 20 5 15.5 C 3.5 12.5 5 7.5 10.5 5 C 14.5 3.2 18 5 20 8.5 C 22 5 25.5 3.2 29.5 5 C 35 7.5 36.5 12.5 35 15.5 C 30 20 24 23.5 20 25 C 20.5 28 20.5 33 20 38 Z");

  // 화사한 가을 은행잎 황금빛 팔레트
  const leafColors = [
    '#FACC15', // 눈부신 샛노랑
    '#EAB308', // 깊은 황금빛 노랑
    '#FDE047', // 맑은 레몬빛 샛노랑
    '#F59E0B', // 짙은 앰버 골드
    '#FEF08A'  // 햇살 비치는 밝은 노랑
  ];

  const LEAF_COUNT = 48; // 첫 오픈 때 와르르 쏟아지는 은행잎 수
  const leaves = [];

  for(let i = 0; i < LEAF_COUNT; i++){
    leaves.push({
      x: Math.random() * W,
      y: -40 - Math.random() * (H * 0.9), // 화면 위쪽에서 분산 출발
      vx: (Math.random() - 0.5) * 1.8,
      vy: 2.2 + Math.random() * 2.8,       // 기분 좋게 쏟아지는 낙하 속도
      size: 0.65 + Math.random() * 0.65,  // 다양한 은행잎 크기
      angle: Math.random() * Math.PI * 2,
      vAngle: (Math.random() - 0.5) * 0.05,
      flip: Math.random() * Math.PI,
      vFlip: 0.03 + Math.random() * 0.05,  // 나풀나풀 3D 입체 뒤집힘
      swingPhase: Math.random() * Math.PI * 2,
      swingSpeed: 0.03 + Math.random() * 0.03,
      swingAmp: 1.5 + Math.random() * 2.2, // 좌우 살랑거리는 바람 진폭
      color: leafColors[Math.floor(Math.random() * leafColors.length)],
      opacity: 0.88 + Math.random() * 0.12
    });
  }

  let startTime = performance.now();
  const DURATION = 5200; // 약 5.2초 동안 화려하게 연출 후 부드럽게 종료
  let animId = null;

  function render(now){
    const elapsed = now - startTime;
    ctx.clearRect(0, 0, W, H);

    // 4초 이후부터 서서히 페이드아웃
    let globalFade = 1;
    if(elapsed > 3800){
      globalFade = Math.max(0, 1 - (elapsed - 3800) / 1400);
    }

    leaves.forEach(l => {
      l.swingPhase += l.swingSpeed;
      l.x += l.vx + Math.sin(l.swingPhase) * l.swingAmp;
      l.y += l.vy;
      l.angle += l.vAngle;
      l.flip += l.vFlip;

      ctx.save();
      ctx.translate(l.x, l.y);
      ctx.rotate(l.angle);
      // Math.sin(flip)으로 가을바람에 은행잎이 3D로 팔랑팔랑 뒤집히는 효과
      ctx.scale(l.size * Math.sin(l.flip), l.size);
      ctx.globalAlpha = l.opacity * globalFade;

      ctx.fillStyle = l.color;
      ctx.shadowColor = 'rgba(40, 35, 10, 0.28)';
      ctx.shadowBlur = 5;
      ctx.shadowOffsetY = 2.5;

      // 40x40 기준 중앙 정렬 오프셋 (-20, -20)
      ctx.translate(-20, -20);
      ctx.fill(leafPath);

      // 연한 잎맥 라인
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.45)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(20, 25); ctx.lineTo(13, 10);
      ctx.moveTo(20, 25); ctx.lineTo(20, 9);
      ctx.moveTo(20, 25); ctx.lineTo(27, 10);
      ctx.stroke();

      ctx.restore();
    });

    if(elapsed < DURATION && globalFade > 0.01){
      animId = requestAnimationFrame(render);
    } else {
      ctx.clearRect(0, 0, W, H);
      canvas.remove(); // 애니메이션 완료 시 캔버스 완전 정리 (메모리·배터리 최적화)
    }
  }

  animId = requestAnimationFrame(render);
})();
</script>
